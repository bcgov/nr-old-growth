---
version: "3.8"

services:
  database:
    container_name: database
    build:
      context: database
      dockerfile: Dockerfile
    pull_policy: build
    image: nr-old-growth-database:18
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: default
    hostname: database
    restart: always
    volumes:
      - /var/lib/postgresql

  backend:
    container_name: backend
    entrypoint:
      - "sh"
      - "-c"
      - "npm ci --ignore-scripts && npm run start"
    environment:
      NODE_ENV: development
      POSTGRESQL_HOST: database
      POSTGRESQL_USER: default
      POSTGRESQL_PASSWORD: default
      POSTGRESQL_DATABASE: default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    hostname: backend
    image: node:26-bookworm-slim
    links:
      - database
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app:z
      - /app/node_modules
    working_dir: "/app"
