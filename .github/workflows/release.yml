name: Release

# Publishing a GitHub release deploys that release's commit to PROD. It reuses
# the backend image merge-main.yml deployed to TEST and does not rebuild anything.

on:
  release:
    types: [published]

# Same group as merge-main.yml (its workflow name), so the two never deploy at once
concurrency:
  group: Merge
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAME: nrog

jobs:
  resolve:
    name: Resolve Images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      backend_digest: ${{ fromJson(steps.tracker.outputs.digests).backend }}
      database_digest: ${{ fromJson(steps.tracker.outputs.digests).database }}
    steps:
      - uses: actions/checkout@v7

      # Backend and database images for the release's commit (last built digest if this commit built none)
      - name: Resolve images
        id: tracker
        uses: bcgov/actions/image-tracker@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          packages: |
            backend
            database
          max_depth: 100

      - name: Summary
        env:
          DIGESTS: ${{ steps.tracker.outputs.digests }}
          RELEASE: ${{ github.event.release.tag_name }}
        run: |
          BACKEND_DIGEST=$(echo "${DIGESTS}" | jq -r '.backend // empty')
          DATABASE_DIGEST=$(echo "${DIGESTS}" | jq -r '.database // empty')
          if [ -z "${BACKEND_DIGEST}" ]; then
            echo "::error::No backend image found for ${RELEASE} (${GITHUB_SHA})."
            exit 1
          fi
          echo "${RELEASE}: backend@${BACKEND_DIGEST}" | tee -a "${GITHUB_STEP_SUMMARY}"
          if [ -n "${DATABASE_DIGEST}" ]; then
            echo "${RELEASE}: database@${DATABASE_DIGEST}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  deploy-prod-database:
    name: Deploy Database on Prod Env
    needs:
      - resolve
    env:
      ZONE: prod
    environment: prod
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Init
        uses: bcgov/actions-openshift/deployer@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: false
          parameters: -p ZONE=${{ env.ZONE }} -p NAME=${{ github.event.repository.name }}

      - name: Deploy Database
        uses: bcgov/actions-openshift/deployer@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          file: .github/openshift/deploy.database.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters: -p ZONE=${{ env.ZONE }} -p TAG=@${{ needs.resolve.outputs.database_digest }} -p NAME=${{ github.event.repository.name }}

  deploy-prod-backend:
    name: Deploy Backend on Prod Env
    needs:
      - deploy-prod-database
      - resolve
    env:
      ZONE: prod
    environment: prod
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          file: .github/openshift/deploy.backend.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters:
            -p ZONE=${{ env.ZONE }} -p TAG=@${{ needs.resolve.outputs.backend_digest }} -p NAME=${{ github.event.repository.name }}
            -p CHES_CLIENT_ID=${{ secrets.CHES_CLIENT_ID }}
            -p CHES_CLIENT_SECRET=${{ secrets.CHES_CLIENT_SECRET }}
            -p CHES_TOKEN_URL='https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token'
            -p CHES_API_URL='https://ches.api.gov.bc.ca/api/v1'
            -p NODE_ENV='production'
            -p BCEID_FORM_PASSWORD=${{ secrets.CHEFS_BCEID_FORM_PASSWORD}}
            -p IDIR_FORM_PASSWORD=${{ secrets.CHEFS_IDIR_FORM_PASSWORD}}

  image-promotions:
    name: Promote Images to Prod
    needs:
      - resolve
      - deploy-prod-backend
    permissions:
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/backend
          target: ${{ needs.resolve.outputs.backend_digest }}
          tags: prod

      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        if: needs.resolve.outputs.database_digest != ''
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/database
          target: ${{ needs.resolve.outputs.database_digest }}
          tags: prod

  results:
    name: Release Results
    needs: [resolve, deploy-prod-database, deploy-prod-backend, image-promotions]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
