name: Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAME: nrog

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      - name: Skip issue templates and docs
        id: diff
        uses: bcgov/actions/diff-triggers@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          triggers: |
            .
            !.github/ISSUE_TEMPLATE/*
            !**.md

  tests-backend:
    name: Backend Unit Tests
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          # Ephemeral e2e database on the runner, no credentials needed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Run tests
        uses: bcgov/actions/test-and-analyse@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          commands: |
            npm ci
            npm run test:cov
            npm run test:e2e
          dir: backend
          node_version: 20

  codeql:
    name: Semantic Code Analysis
    runs-on: ubuntu-26.04
    needs:
      - tests-backend
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Build Backend
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  resolve:
    name: Resolve Images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.tracker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Walk per package. An image that was not built for this commit keeps its last digest.
      - name: Resolve images
        id: tracker
        uses: bcgov/actions/image-tracker@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          package: backend
          max_depth: 100

  deploy-test-database:
    name: Deploy Database on Test Env
    needs:
      - tests-backend
    env:
      ZONE: test
    environment: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@97cb3f8a5a6d134594c85224d3f593e3c0e90647 # v0.4.0
        with:
          file: .github/openshift/deploy.database.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: false
          parameters: -p ZONE=${{ env.ZONE }} -p NAME=${{ github.event.repository.name }}

  deploy-test-backend:
    name: Deploy Backend on Test Env
    needs:
      - deploy-test-database
      - resolve
    env:
      ZONE: test
    environment: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@97cb3f8a5a6d134594c85224d3f593e3c0e90647 # v0.4.0
        with:
          file: .github/openshift/deploy.backend.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters:
            -p ZONE=${{ env.ZONE }} -p TAG=@${{ needs.resolve.outputs.digest }} -p NAME=${{ github.event.repository.name }}
            -p CHES_CLIENT_ID=${{ secrets.CHES_CLIENT_ID }}
            -p CHES_CLIENT_SECRET=${{ secrets.CHES_CLIENT_SECRET }}
            -p CHES_TOKEN_URL='https://test.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token'
            -p CHES_API_URL='https://ches-test.api.gov.bc.ca/api/v1'
            -p NODE_ENV='development'
            -p BCEID_FORM_PASSWORD=${{ secrets.CHEFS_BCEID_FORM_PASSWORD}}
            -p IDIR_FORM_PASSWORD=${{ secrets.CHEFS_IDIR_FORM_PASSWORD}}

  deploy-prod-database:
    name: Deploy Database on Prod Env
    needs:
      - deploy-test-backend
    env:
      ZONE: prod
    environment: prod
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@97cb3f8a5a6d134594c85224d3f593e3c0e90647 # v0.4.0
        with:
          file: .github/openshift/deploy.database.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: false
          parameters: -p ZONE=${{ env.ZONE }} -p NAME=${{ github.event.repository.name }}

  deploy-prod-backend:
    name: Deploy Backend on Prod Env
    needs:
      - deploy-prod-database
      - resolve
    env:
      ZONE: prod
    environment: prod
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@97cb3f8a5a6d134594c85224d3f593e3c0e90647 # v0.4.0
        with:
          file: .github/openshift/deploy.backend.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters:
            -p ZONE=${{ env.ZONE }} -p TAG=@${{ needs.resolve.outputs.digest }} -p NAME=${{ github.event.repository.name }}
            -p CHES_CLIENT_ID=${{ secrets.CHES_CLIENT_ID }}
            -p CHES_CLIENT_SECRET=${{ secrets.CHES_CLIENT_SECRET }}
            -p CHES_TOKEN_URL='https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token'
            -p CHES_API_URL='https://ches.api.gov.bc.ca/api/v1'
            -p NODE_ENV='production'
            -p BCEID_FORM_PASSWORD=${{ secrets.CHEFS_BCEID_FORM_PASSWORD}}
            -p IDIR_FORM_PASSWORD=${{ secrets.CHEFS_IDIR_FORM_PASSWORD}}

  image-promotions:
    name: Promote Images to Prod
    needs:
      - resolve
      - deploy-prod-backend
    permissions:
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/backend
          target: ${{ needs.resolve.outputs.digest }}
          tags: prod

  results:
    name: Merge Results
    needs: [changes, tests-backend, codeql, resolve, deploy-test-database, deploy-test-backend, deploy-prod-database, deploy-prod-backend, image-promotions]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
          title: "Merge Results"
