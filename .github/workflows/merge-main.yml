name: Merge

# Merges deploy to TEST. Publishing a GitHub release deploys PROD (release.yml).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAME: nrog

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      - name: Skip issue templates and docs
        id: diff
        uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          triggers: |
            .
            !.github/ISSUE_TEMPLATE/*
            !**.md

  tests-backend:
    name: Backend Unit Tests
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          # Ephemeral e2e database on the runner, no credentials needed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Run tests
        uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          commands: |
            npm ci
            npm run test:cov
            npm run test:e2e
          dir: backend
          node_version: 20

  codeql:
    name: Semantic Code Analysis
    runs-on: ubuntu-26.04
    needs:
      - tests-backend
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Build Backend
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  resolve:
    name: Resolve Images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.tracker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Walk per package. An image that was not built for this commit keeps its last digest.
      - name: Resolve images
        id: tracker
        uses: bcgov/actions/image-tracker@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: backend
          max_depth: 100

  deploy-test-database:
    name: Deploy Database on Test Env
    needs:
      - tests-backend
    env:
      ZONE: test
    environment: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Init
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: false
          parameters: -p ZONE=${{ env.ZONE }} -p NAME=${{ github.event.repository.name }}

      - name: Deploy Database
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: .github/openshift/deploy.database.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters: -p ZONE=${{ env.ZONE }} -p NAME=${{ github.event.repository.name }}

  deploy-test-backend:
    name: Deploy Backend on Test Env
    needs:
      - deploy-test-database
      - resolve
    env:
      ZONE: test
    environment: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Deploys
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: .github/openshift/deploy.backend.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: "4.13"
          overwrite: true
          parameters:
            -p ZONE=${{ env.ZONE }} -p TAG=@${{ needs.resolve.outputs.digest }} -p NAME=${{ github.event.repository.name }}
            -p CHES_CLIENT_ID=${{ secrets.CHES_CLIENT_ID }}
            -p CHES_CLIENT_SECRET=${{ secrets.CHES_CLIENT_SECRET }}
            -p CHES_TOKEN_URL='https://test.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token'
            -p CHES_API_URL='https://ches-test.api.gov.bc.ca/api/v1'
            -p NODE_ENV='development'
            -p BCEID_FORM_PASSWORD=${{ secrets.CHEFS_BCEID_FORM_PASSWORD}}
            -p IDIR_FORM_PASSWORD=${{ secrets.CHEFS_IDIR_FORM_PASSWORD}}

  results:
    name: Merge Results
    needs: [changes, tests-backend, codeql, resolve, deploy-test-database, deploy-test-backend]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
