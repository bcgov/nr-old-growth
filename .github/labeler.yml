github_actions:
  - changed-files:
      - any-glob-to-any-file: .github/*

tests:
  - changed-files:
      - any-glob-to-any-file: backend/test/**/*

source:
  - changed-files:
      - any-glob-to-any-file: backend/src/**/*

docker:
  - changed-files:
      - any-glob-to-any-file: backend/Dockerfile

dependencies:
  - changed-files:
      - any-glob-to-any-file: backend/package.json

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - backend/docs/**/*
          - docs/**/*

openshift:
  - changed-files:
      - any-glob-to-any-file: .github/openshift/.*.yml
